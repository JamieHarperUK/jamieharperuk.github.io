<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>FC Template Manager</title>
        <style>
            :root {
                --bg: #09111c;
                --panel: #0f1a2b;
                --panel-alt: #121f32;
                --line: rgba(255,255,255,0.12);
                --text: #edf4ff;
                --muted: #9bb0c8;
                --accent: #6dd5ff;
                --accent-strong: #1aa0ff;
                --green: #7fe7c6;
                --amber: #f9d77c;
                --danger: #f17373;
            }

            * { box-sizing: border-box; }
            body {
                margin: 0;
                font-family: "Segoe UI", sans-serif;
                background: linear-gradient(180deg, #09111c, #0d1624 55%, #0f1c2f);
                color: var(--text);
            }
            .shell {
                max-width: 1400px;
                margin: 0 auto;
                padding: 24px;
            }
            .topbar {
                display: flex;
                justify-content: space-between;
                align-items: center;
                gap: 16px;
                padding: 20px 24px;
                border: 1px solid var(--line);
                background: rgba(15,26,43,0.94);
                border-radius: 18px;
                margin-bottom: 18px;
                box-shadow: 0 12px 30px rgba(0,0,0,0.18);
            }
            .brand {
                display: flex;
                flex-direction: column;
                gap: 4px;
            }
            .brand h1 {
                margin: 0;
                font-size: clamp(1.5rem, 3vw, 2.5rem);
                letter-spacing: 0.04em;
            }
            .brand small {
                color: var(--muted);
            }
            .repo-box {
                display: flex;
                flex-wrap: wrap;
                gap: 8px;
                align-items: center;
                justify-content: flex-end;
            }
            .repo-box input, .repo-box button, .toolbar button, .editor-actions button, .status-row button {
                border: 1px solid var(--line);
                border-radius: 10px;
                font: inherit;
            }
            .repo-box input {
                background: rgba(255,255,255,0.04);
                color: var(--text);
                min-width: 300px;
                padding: 10px 12px;
            }
            .repo-box button, .toolbar button, .editor-actions button, .status-row button {
                background: linear-gradient(180deg, var(--accent-strong), #0e72ce);
                color: white;
                padding: 10px 16px;
                font-weight: 600;
                cursor: pointer;
            }
            .repo-box button.secondary, .toolbar button.secondary, .editor-actions button.secondary, .status-row button.secondary {
                background: rgba(255,255,255,0.05);
                border-color: var(--line);
                color: var(--text);
            }
            .repo-box button.warn, .toolbar button.warn {
                background: linear-gradient(180deg, #db6a46, #bb4d2a);
            }
            .layout {
                display: grid;
                grid-template-columns: minmax(240px, 320px) minmax(0, 1fr);
                gap: 18px;
            }
            .panel {
                background: rgba(15,26,43,0.96);
                border: 1px solid var(--line);
                border-radius: 18px;
                box-shadow: 0 12px 30px rgba(0,0,0,0.12);
            }
            .files-panel {
                padding: 18px;
            }
            .files-panel h2, .editor-panel h2 {
                margin-top: 0;
                margin-bottom: 12px;
                font-size: 1.1rem;
            }
            .file-list {
                list-style: none;
                margin: 0;
                padding: 0;
                display: flex;
                flex-direction: column;
                gap: 8px;
            }
            .file-item {
                border: 1px solid var(--line);
                border-radius: 12px;
                background: rgba(255,255,255,0.02);
                padding: 10px 12px;
                display: flex;
                align-items: center;
                justify-content: space-between;
                gap: 10px;
            }
            .file-item.active {
                border-color: rgba(109,213,255,0.9);
                background: rgba(26,160,255,0.08);
            }
            .file-main {
                display: flex;
                align-items: center;
                gap: 8px;
                min-width: 0;
                cursor: pointer;
            }
            .file-main input {
                accent-color: var(--accent-strong);
            }
            .file-label {
                white-space: nowrap;
                overflow: hidden;
                text-overflow: ellipsis;
            }
            .file-badge {
                display: inline-flex;
                align-items: center;
                justify-content: center;
                border-radius: 999px;
                padding: 4px 8px;
                font-size: 0.72rem;
                background: rgba(127,231,198,0.12);
                color: var(--green);
                border: 1px solid rgba(127,231,198,0.2);
            }
            .editor-panel {
                padding: 18px;
                display: flex;
                flex-direction: column;
                gap: 14px;
            }
            .toolbar,
            .editor-actions,
            .status-row {
                display: flex;
                flex-wrap: wrap;
                gap: 10px;
                align-items: center;
            }
            .toolbar {
                justify-content: space-between;
            }
            .status-pill {
                display: inline-flex;
                align-items: center;
                gap: 8px;
                padding: 8px 12px;
                border-radius: 999px;
                border: 1px solid var(--line);
                background: rgba(255,255,255,0.03);
                color: var(--muted);
                font-size: 0.82rem;
            }
            .status-pill.ok { color: var(--green); border-color: rgba(127,231,198,0.3); }
            .status-pill.warn { color: var(--amber); border-color: rgba(249,215,124,0.3); }
            .status-pill.bad { color: var(--danger); border-color: rgba(241,115,115,0.3); }
            textarea {
                width: 100%;
                min-height: 540px;
                background: rgba(6, 12, 18, 0.9);
                color: #dfeaff;
                border: 1px solid var(--line);
                border-radius: 12px;
                padding: 16px;
                resize: vertical;
                font-family: "Cascadia Code", "SFMono-Regular", Consolas, monospace;
                font-size: 0.92rem;
                line-height: 1.5;
            }
            .output {
                min-height: 88px;
                max-height: 180px;
                overflow: auto;
                border: 1px solid var(--line);
                border-radius: 12px;
                padding: 12px 14px;
                background: rgba(4,10,16,0.65);
                color: var(--muted);
                white-space: pre-wrap;
                font-family: "Cascadia Code", "SFMono-Regular", monospace;
                font-size: 0.82rem;
            }
            .muted {
                color: var(--muted);
            }
            @media (max-width: 900px) {
                .layout { grid-template-columns: 1fr; }
                .topbar { flex-direction: column; align-items: stretch; }
                .repo-box { justify-content: stretch; }
                .repo-box input { min-width: 0; flex: 1 1 100%; }
            }
        </style>
    </head>
    <body>
        <div class="shell">
            <header class="topbar">
                <div class="brand">
                    <h1>FC Template Manager</h1>
                    <small>Multi-file GitHub editor for fc_template data</small>
                </div>
                <div class="repo-box">
                    <input id="repoInput" type="text" value="jamieharperuk/jamieharperuk.github.io" aria-label="GitHub repository name">
                    <button id="connectBtn">Connect</button>
                </div>
            </header>

            <div class="layout">
                <aside class="panel files-panel">
                    <h2>Files</h2>
                    <ul id="fileList" class="file-list"></ul>
                </aside>

                <main class="panel editor-panel">
                    <h2 id="editorTitle">Club</h2>
                    <div class="toolbar">
                        <div class="status-row">
                            <span id="repoStatus" class="status-pill">Not connected</span>
                            <span id="branchStatus" class="status-pill">branch: main</span>
                        </div>
                        <div class="editor-actions">
                            <button id="saveLocalBtn" class="secondary" type="button">Save local copy</button>
                            <button id="commitBtn" type="button">Commit selected files</button>
                        </div>
                    </div>

                    <textarea id="editorArea" spellcheck="false" aria-label="JSON content editor"></textarea>

                    <div id="output" class="output">Ready.</div>
                </main>
            </div>
        </div>

        <script src="manager.js"></script>
    </body>
</html>
