<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta http-equiv="refresh" content="0; url=./manager.html" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>FC Template Manager</title>
    <style>
      :root {
        --bg: #07131d;
        --panel: #101d2d;
        --line: #294563;
        --text: #edf6ff;
        --muted: #b9cae5;
        --accent: #76d7ff;
      }
      * { box-sizing: border-box; }
      html, body {
        margin: 0;
        min-height: 100%;
        font-family: Inter, "Segoe UI", sans-serif;
        background: linear-gradient(180deg, #07131d 0%, #0d1729 100%);
        color: var(--text);
      }
      body {
        display: grid;
        place-items: center;
        min-height: 100vh;
        padding: 32px;
      }
      .panel {
        max-width: 560px;
        width: 100%;
        background: rgba(16, 29, 45, 0.96);
        border: 1px solid var(--line);
        border-radius: 18px;
        padding: 28px;
        box-shadow: 0 22px 50px rgba(5, 12, 20, 0.45);
      }
      h1 {
        margin: 0 0 12px;
        font-size: clamp(1.5rem, 2vw, 2rem);
      }
      p {
        color: var(--muted);
        line-height: 1.6;
        margin: 0 0 18px;
      }
      a {
        color: var(--accent);
        text-decoration: none;
        font-weight: 700;
      }
      a:hover { text-decoration: underline; }
    </style>
  </head>
  <body>
    <div class="panel">
      <h1>FC Template Manager</h1>
      <p>This page has moved to the single canonical manager for the fc-template site.</p>
      <p><a href="./manager.html">Open the combined manager</a></p>
    </div>

    <script>
      window.location.replace('./manager.html');
    </script>
  </body>
</html>
