<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>FC Template Manager</title>
        <style>
            :root {
                --bg: #0a1220;
                --panel: #101b2d;
                --panel-strong: #14233d;
                --line: #2b3f5f;
                --text: #edf4ff;
                --muted: #aabbd9;
                --accent: #76d7ff;
                --accent-strong: #2d8cff;
                --success: #5fe0a8;
                --warning: #ffbd71;
                --danger: #ff7684;
                --shadow: rgba(8, 15, 28, 0.5);
            }

            * { box-sizing: border-box; }
            html, body {
                margin: 0;
                min-height: 100%;
                font-family: Inter, "Segoe UI", sans-serif;
                background: linear-gradient(180deg, #09121d 0%, #0d1525 100%);
                color: var(--text);
            }
            body { padding: 24px; }
            .shell { max-width: 1300px; margin: 0 auto; }
            header {
                display: flex;
                align-items: center;
                justify-content: space-between;
                gap: 16px;
                padding: 18px 20px;
                margin-bottom: 24px;
                background: linear-gradient(140deg, rgba(18, 29, 48, 0.96), rgba(12, 21, 35, 0.96));
                border: 1px solid var(--line);
                border-radius: 18px;
                box-shadow: 0 18px 44px var(--shadow);
            }
            .brand { display: flex; flex-direction: column; gap: 4px; }
            .eyebrow {
                font-size: 11px;
                letter-spacing: 0.18em;
                text-transform: uppercase;
                color: var(--accent);
                font-weight: 700;
            }
            h1 { font-size: clamp(1.35rem, 2vw, 2rem); margin: 0; }
            .tagline { color: var(--muted); margin: 0; }
            .repo-meta { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
            .status-pill { padding: 8px 12px; border: 1px solid var(--line); border-radius: 999px; background: rgba(118, 215, 255, 0.08); color: var(--accent); font-weight: 600; }
            .status-pill.warn { color: var(--warning); border-color: rgba(255, 189, 113, 0.4); }
            .layout { display: grid; grid-template-columns: 360px minmax(0, 1fr); gap: 24px; }
            .panel { background: rgba(16, 27, 45, 0.96); border: 1px solid var(--line); border-radius: 18px; box-shadow: 0 20px 38px rgba(7, 14, 25, 0.38); }
            .sidebar { padding: 18px; }
            .sidebar .section { margin-bottom: 18px; }
            .sidebar .section:last-child { margin-bottom: 0; }
            label {
                display: flex;
                flex-direction: column;
                gap: 8px;
                font-size: 0.82rem;
                color: var(--muted);
                margin-bottom: 12px;
            }
            input, textarea, button, select {
                width: 100%;
                border: 1px solid var(--line);
                background: #0d182b;
                color: var(--text);
                border-radius: 10px;
                padding: 10px 12px;
                font: inherit;
            }
            textarea { min-height: 92px; resize: vertical; }
            button {
                cursor: pointer;
                border: 1px solid transparent;
                transition: transform 0.15s ease, border-color 0.15s ease, background 0.15s ease;
            }
            button:hover { transform: translateY(-1px); }
            .primary { background: linear-gradient(180deg, var(--accent-strong), #2d5be2); color: #041623; font-weight: 700; }
            .secondary { background: rgba(118, 215, 255, 0.09); border-color: rgba(118, 215, 255, 0.3); color: var(--text); }
            .danger { background: rgba(255, 118, 132, 0.08); border-color: rgba(255, 118, 132, 0.32); color: var(--text); }
            .toolbar { display: flex; gap: 10px; flex-wrap: wrap; margin-top: 12px; }
            .status {
                padding: 12px;
                border-radius: 12px;
                background: rgba(17, 27, 42, 0.9);
                border: 1px solid var(--line);
                color: var(--muted);
                margin-top: 12px;
                min-height: 50px;
            }
            .status.ok { color: #d9ffef; border-color: rgba(95, 224, 168, 0.32); background: rgba(95, 224, 168, 0.09); }
            .status.bad { color: #ffdfe3; border-color: rgba(255, 118, 132, 0.32); background: rgba(255, 118, 132, 0.08); }
            .status.info { color: #e8f3ff; border-color: rgba(118, 215, 255, 0.18); background: rgba(118, 215, 255, 0.08); }
            .content { padding: 18px; }
            .tab-list { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 18px; }
            .tab-button { width: auto; min-width: 116px; }
            .tab-button.active { border-color: rgba(118, 215, 255, 0.42); background: rgba(118, 215, 255, 0.12); }
            .file-header { display: flex; align-items: center; justify-content: space-between; gap: 12px; margin-bottom: 16px; }
            .file-header h2 { margin: 0; font-size: 1.2rem; }
            .meta-chip { padding: 6px 10px; border-radius: 999px; border: 1px solid var(--line); color: var(--muted); background: rgba(255, 255, 255, 0.02); font-size: 0.78rem; }
            .record-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(210px, 1fr)); gap: 12px; }
            .record-card { display: flex; flex-direction: column; gap: 12px; background: rgba(12, 19, 31, 0.8); border: 1px solid var(--line); border-radius: 14px; padding: 14px; }
            .record-card h3 { margin: 0; font-size: 1rem; }
            .mini-list { display: grid; gap: 12px; }
            .sub-card { padding: 12px; border-radius: 12px; border: 1px solid var(--line); background: rgba(18, 29, 47, 0.9); }
            .sub-card h4 { margin: 0 0 10px; }
            .btn-row { display: flex; gap: 8px; flex-wrap: wrap; }
            .hidden { display: none !important; }
            .empty-state { padding: 22px; border: 1px dashed var(--line); border-radius: 14px; color: var(--muted); background: rgba(255, 255, 255, 0.01); }
            @media (max-width: 980px) {
                body { padding: 16px; }
                .layout { grid-template-columns: 1fr; }
            }
        </style>
    </head>
    <body>
        <div class="shell">
            <header>
                <div class="brand">
                    <span class="eyebrow">Oakshift FC</span>
                    <h1>FC Template Manager</h1>
                    <p class="tagline">GitHub OAuth editor for the fc-template data files in this site.</p>
                </div>
                <div class="repo-meta">
                    <span id="repoBadge" class="status-pill">No repo connected</span>
                </div>
            </header>

            <div class="layout">
                <aside class="panel sidebar">
                    <div class="section">
                        <h2>Repository</h2>
                        <label>
                            GitHub repo
                            <input id="repoInput" type="text" value="jamieharperuk/jamieharperuk.github.io" placeholder="owner/repo">
                        </label>
                        <label>
                            Site base URL
                            <input id="siteUrlInput" type="url" value="https://jamieharperuk.github.io/fc-template/" placeholder="https://your-site.github.io/fc-template/">
                        </label>
                        <div class="toolbar">
                            <button id="signInBtn" type="button" class="primary">Sign in with GitHub</button>
                            <button id="loadRepoBtn" type="button" class="secondary">Load fc-template files</button>
                        </div>
                        <div id="repoStatus" class="status info">Authenticate and load the repository to start editing the club data.</div>
                    </div>

                    <div class="section">
                        <h2>Commit</h2>
                        <label>
                            Commit message
                            <input id="commitMessageInput" type="text" value="Update fc-template data" placeholder="Update fc-template data">
                        </label>
                        <div class="toolbar">
                            <button id="commitBtn" type="button" class="primary">Commit changed files</button>
                            <button id="resetBtn" type="button" class="secondary">Reset edits</button>
                        </div>
                    </div>
                </aside>

                <main class="panel content">
                    <div id="editorContainer">
                        <div class="empty-state">Connect a repository, then select a file to edit.</div>
                    </div>
                </main>
            </div>
        </div>

        <script>
            (() => {
                const API_BASE = "https://api.github.com";
                const AUTH_STORAGE_KEY = "fc_template_manager_auth";

                function resolveDefaultSiteBaseUrl() {
                    if (typeof window === "undefined") {
                        return "https://jamieharperuk.github.io/fc-template/";
                    }

                    const origin = window.location.origin || "https://jamieharperuk.github.io";
                    const pathname = window.location.pathname || "/";
                    if (pathname.includes("/fc-template")) {
                        const base = pathname.replace(/\/manager(?:3)?\.html?$/i, "").replace(/\/+$/, "");
                        return `${origin}${base}/`;
                    }
                    return "https://jamieharperuk.github.io/fc-template/";
                }

                const DEFAULT_CONFIG = {
                    repoFullName: "jamieharperuk/jamieharperuk.github.io",
                    siteBaseUrl: resolveDefaultSiteBaseUrl(),
                    commitMessage: "Update fc-template data",
                    oauth: {
                        clientId: "Ov23liJxZCIXpxYWlATm",
                        scope: "repo read:user",
                        brokerBaseUrl: "https://ghwe.oakshiftsoftware.workers.dev"
                    }
                };

                const FILE_DEFS = Object.freeze({
                    club: {
                        label: "Club",
                        path: "fc-template/data/fc_club.json",
                        arrayKey: "club",
                        kind: "club",
                        fileKind: "object",
                        fields: [
                            ["club_name", "Club name"],
                            ["home_venue", "Home venue"],
                            ["city", "City"],
                            ["country", "Country"],
                            ["established_year", "Established year"],
                            ["description", "Description"]
                        ],
                        nestedFields: [
                            ["facebook", "Facebook"],
                            ["twitter_x", "Twitter / X"],
                            ["instagram", "Instagram"],
                            ["youtube", "YouTube"],
                            ["tiktok", "TikTok"]
                        ]
                    },
                    games: {
                        label: "Games",
                        path: "fc-template/data/fc_games.json",
                        arrayKey: "games",
                        kind: "array",
                        fileKind: "array",
                        fields: [
                            ["home_or_away", "Home / away"],
                            ["home_team", "Home team"],
                            ["away_team", "Away team"],
                            ["date", "Date"],
                            ["time", "Time"],
                            ["competition", "Competition"],
                            ["venue", "Venue"],
                            ["home_score", "Home score"],
                            ["away_score", "Away score"],
                            ["winner", "Winner"]
                        ]
                    },
                    teams: {
                        label: "Teams",
                        path: "fc-template/data/fc_teams.json",
                        arrayKey: "teams",
                        kind: "array",
                        fileKind: "array",
                        fields: [
                            ["team_name", "Team name"],
                            ["team_type", "Team type"],
                            ["competition", "Competition"],
                            ["country", "Country"],
                            ["home_venue", "Home venue"]
                        ]
                    },
                    tables: {
                        label: "Tables",
                        path: "fc-template/data/fc_tables.json",
                        arrayKey: "tables",
                        kind: "array",
                        fileKind: "array",
                        fields: [
                            ["title", "Title"],
                            ["season", "Season"]
                        ]
                    },
                    tickets: {
                        label: "Tickets",
                        path: "fc-template/data/fc_tickets.json",
                        arrayKey: "tickets",
                        kind: "array",
                        fileKind: "array",
                        fields: [
                            ["title", "Title"],
                            ["match", "Match"],
                            ["date", "Date"],
                            ["venue", "Venue"],
                            ["status", "Status"],
                            ["notes", "Notes"],
                            ["link", "Link"]
                        ]
                    }
                });

                const state = {
                    token: "",
                    repoFullName: DEFAULT_CONFIG.repoFullName,
                    siteBaseUrl: DEFAULT_CONFIG.siteBaseUrl,
                    files: {},
                    activeKey: "club",
                    dirtyKeys: new Set(),
                    commitMessage: DEFAULT_CONFIG.commitMessage
                };

                const repoInput = document.getElementById("repoInput");
                const siteUrlInput = document.getElementById("siteUrlInput");
                const repoStatus = document.getElementById("repoStatus");
                const repoBadge = document.getElementById("repoBadge");
                const editorContainer = document.getElementById("editorContainer");
                const commitMessageInput = document.getElementById("commitMessageInput");

                function setStatus(message, type = "info") {
                    repoStatus.className = `status ${type}`;
                    repoStatus.textContent = message;
                }

                function escapeHtml(value) {
                    return String(value ?? "").replace(/[&<>\"']/g, (char) => ({
                        "&": "&amp;",
                        "<": "&lt;",
                        ">": "&gt;",
                        '"': "&quot;",
                        "'": "&#039;"
                    }[char]));
                }

                function getStoredSession() {
                    try {
                        const raw = sessionStorage.getItem(AUTH_STORAGE_KEY);
                        if (!raw) return null;
                        const parsed = JSON.parse(raw);
                        if (!parsed || !parsed.accessToken) return null;
                        return parsed;
                    } catch (_error) {
                        sessionStorage.removeItem(AUTH_STORAGE_KEY);
                        return null;
                    }
                }

                function saveStoredSession(accessToken) {
                    state.token = accessToken;
                    sessionStorage.setItem(AUTH_STORAGE_KEY, JSON.stringify({ accessToken }));
                }

                function clearStoredSession() {
                    state.token = "";
                    sessionStorage.removeItem(AUTH_STORAGE_KEY);
                }

                function getSiteBaseUrl() {
                    const rawValue = siteUrlInput.value.trim();
                    if (rawValue) {
                        state.siteBaseUrl = rawValue;
                        return rawValue;
                    }
                    return DEFAULT_CONFIG.siteBaseUrl;
                }

                function getRepoFullName() {
                    const rawValue = repoInput.value.trim();
                    state.repoFullName = rawValue;
                    return rawValue;
                }

                function getFilePayload(key) {
                    return state.files[key]?.data ?? null;
                }

                function isDirty(key) {
                    return state.dirtyKeys.has(key);
                }

                function markDirty(key, isDirtyValue = true) {
                    if (isDirtyValue) state.dirtyKeys.add(key);
                    else state.dirtyKeys.delete(key);
                }

                function buildFileTemplate(key) {
                    const def = FILE_DEFS[key];
                    switch (key) {
                        case "club":
                            return {
                                metadata: { lastUpdated: new Date().toISOString(), version: "1.0.0" },
                                club: {
                                    club_name: "The Club",
                                    home_venue: "Home Ground",
                                    city: "City Name",
                                    country: "Country Name",
                                    established_year: "2026",
                                    description: "Your club description here.",
                                    socials: {
                                        facebook: "#",
                                        twitter_x: "#",
                                        instagram: "#",
                                        youtube: "#",
                                        tiktok: "#"
                                    }
                                }
                            };
                        case "games":
                            return { metadata: { lastUpdated: new Date().toISOString(), version: "1.0.0" }, games: [] };
                        case "teams":
                            return { metadata: { lastUpdated: new Date().toISOString(), version: "1.0.0" }, teams: [] };
                        case "tables":
                            return { metadata: { lastUpdated: new Date().toISOString(), version: "1.0.0" }, tables: [] };
                        case "tickets":
                            return { metadata: { lastUpdated: new Date().toISOString(), version: "1.0.0" }, tickets: [] };
                        default:
                            return {};
                    }
                }

                function updateFileData(key, nextValue) {
                    if (!state.files[key]) return;
                    state.files[key].data = nextValue;
                    markDirty(key, true);
                    renderEditor();
                }

                function setValueAtPath(obj, path, value) {
                    const segments = path.split(".");
                    let cursor = obj;
                    for (let i = 0; i < segments.length - 1; i += 1) {
                        const segment = segments[i];
                        if (!(segment in cursor) || typeof cursor[segment] !== "object" || Array.isArray(cursor[segment])) {
                            cursor[segment] = {};
                        }
                        cursor = cursor[segment];
                    }
                    cursor[segments[segments.length - 1]] = value;
                }

                function encodeBase64Utf8(value) {
                    return btoa(unescape(encodeURIComponent(value)));
                }

                async function ghFetch(path, options = {}) {
                    const method = options.method || "GET";
                    const headers = Object.assign({
                        Accept: "application/vnd.github+json",
                        "X-GitHub-Api-Version": "2022-11-28"
                    }, options.headers || {});

                    if (state.token) {
                        headers.Authorization = `Bearer ${state.token}`;
                    }

                    const requestInit = { method, headers };
                    if (options.body) {
                        requestInit.body = options.body;
                    }

                    const response = await fetch(`${API_BASE}${path}`, requestInit);
                    if (response.status === 204) {
                        return null;
                    }

                    const text = await response.text();
                    if (!response.ok) {
                        let message = `GitHub request failed (${response.status})`;
                        try {
                            const payload = JSON.parse(text);
                            message = payload?.message || message;
                        } catch (_error) {
                            message = text || message;
                        }
                        throw new Error(message);
                    }

                    return text ? JSON.parse(text) : null;
                }

                async function brokerRequest(endpoint, payload) {
                    const base = (DEFAULT_CONFIG.oauth.brokerBaseUrl || "https://ghwe.oakshiftsoftware.workers.dev").replace(/\/$/, "");
                    const response = await fetch(`${base}${endpoint}`, {
                        method: "POST",
                        headers: {
                            Accept: "application/json",
                            "Content-Type": "application/x-www-form-urlencoded;charset=UTF-8"
                        },
                        body: new URLSearchParams(payload).toString()
                    });

                    const text = await response.text();
                    if (!response.ok) {
                        throw new Error(text || "Authentication request failed.");
                    }

                    try {
                        return JSON.parse(text);
                    } catch (_error) {
                        return { raw: text };
                    }
                }

                async function startDeviceFlow() {
                    const clientId = DEFAULT_CONFIG.oauth.clientId;
                    if (!clientId) {
                        throw new Error("No OAuth client ID configured for the manager.");
                    }

                    const deviceCodeResponse = await brokerRequest("/github/device/code", {
                        client_id: clientId,
                        scope: DEFAULT_CONFIG.oauth.scope
                    });

                    if (!deviceCodeResponse?.device_code) {
                        throw new Error("GitHub device flow did not return a device code.");
                    }

                    const userCode = String(deviceCodeResponse.user_code || "");
                    const verificationUri = String(deviceCodeResponse.verification_uri || "https://github.com/login/device");
                    const intervalSeconds = Number(deviceCodeResponse.interval || 5);
                    const expiresInSeconds = Number(deviceCodeResponse.expires_in || 900);

                    setStatus(`Open ${verificationUri} and enter code: ${userCode}. This window will keep polling for approval for up to ${expiresInSeconds} seconds.`, "info");

                    const startedAt = Date.now();
                    while (Date.now() - startedAt < expiresInSeconds * 1000) {
                        await new Promise((resolve) => setTimeout(resolve, intervalSeconds * 1000));
                        const sessionResponse = await brokerRequest("/github/oauth/access_token", {
                            client_id: clientId,
                            device_code: deviceCodeResponse.device_code,
                            grant_type: "urn:ietf:params:oauth:grant-type:device_code"
                        });

                        if (sessionResponse?.access_token) {
                            saveStoredSession(sessionResponse.access_token);
                            setStatus("GitHub access granted. You can now load and edit the fc-template JSON files.", "ok");
                            await loadRepository();
                            return;
                        }

                        if (sessionResponse?.error && !["authorization_pending", "slow_down"].includes(String(sessionResponse.error))) {
                            throw new Error(String(sessionResponse.error_description || sessionResponse.error || "Device flow failed."));
                        }
                    }

                    throw new Error("GitHub authentication timed out. Please try again.");
                }

                async function loadRepository() {
                    const repoFullName = getRepoFullName();
                    const siteUrl = getSiteBaseUrl();

                    if (!repoFullName || !repoFullName.includes("/")) {
                        setStatus("Enter a GitHub repository in owner/repo format before loading the fc-template files.", "bad");
                        return;
                    }

                    if (!state.token) {
                        setStatus("You must authenticate with GitHub before loading repository data.", "bad");
                        return;
                    }

                    try {
                        const repo = await ghFetch(`/repos/${encodeURIComponent(repoFullName)}`);
                        repoBadge.textContent = `${repo.owner.login}/${repo.name}`;
                        repoBadge.classList.remove("warn");
                        state.repoFullName = repoFullName;
                        state.siteBaseUrl = siteUrl;
                        state.files = {};
                        state.dirtyKeys.clear();

                        for (const [key, def] of Object.entries(FILE_DEFS)) {
                            try {
                                const payload = await ghFetch(`/repos/${encodeURIComponent(repoFullName)}/contents/${encodeURIComponent(def.path)}`);
                                const rawText = decodeURIComponent(escape(atob(payload.content.replace(/\s/g, ""))));
                                const parsed = JSON.parse(rawText);
                                state.files[key] = { def, data: parsed, sha: payload.sha, path: def.path, exists: true };
                            } catch (error) {
                                state.files[key] = { def, data: buildFileTemplate(key), sha: null, path: def.path, exists: false, error: String(error.message || error) };
                            }
                        }

                        renderTabs();
                        renderEditor();
                        setStatus(`Repository loaded successfully: ${repoFullName}. ${Object.keys(state.files).length} fc-template files are ready to edit.`, "ok");
                    } catch (error) {
                        repoBadge.textContent = "Load failed";
                        repoBadge.classList.add("warn");
                        setStatus(error.message || "Could not load the repository.", "bad");
                    }
                }

                function renderTabs() {
                    const tabs = Object.entries(FILE_DEFS).map(([key, def]) => {
                        const isActive = key === state.activeKey;
                        const isDirty = isDirty(key);
                        return `<button type="button" data-key="${key}" class="tab-button ${isActive ? "active" : ""}">${def.label}${isDirty ? " *" : ""}</button>`;
                    }).join("");

                    editorContainer.innerHTML = `<div class="tab-list">${tabs}</div>`;
                    editorContainer.querySelectorAll(".tab-button").forEach((button) => {
                        button.addEventListener("click", () => {
                            state.activeKey = button.dataset.key;
                            renderEditor();
                        });
                    });
                }

                function renderInputField(label, value, path, type = "text") {
                    const safeValue = typeof value === "string" ? value : value == null ? "" : String(value);
                    return `
                        <label>
                            <span>${escapeHtml(label)}</span>
                            <input data-path="${escapeHtml(path)}" type="${type}" value="${escapeHtml(safeValue)}">
                        </label>
                    `;
                }

                function renderTextareaField(label, value, path) {
                    const safeValue = typeof value === "string" ? value : value == null ? "" : String(value);
                    return `
                        <label>
                            <span>${escapeHtml(label)}</span>
                            <textarea data-path="${escapeHtml(path)}">${escapeHtml(safeValue)}</textarea>
                        </label>
                    `;
                }

                function renderClubEditor(data) {
                    const club = data.club || {};
                    const socials = club.socials || {};
                    const mainFields = FILE_DEFS.club.fields.map(([key, label]) => renderInputField(label, club[key], `club.${key}`));
                    const socialFields = FILE_DEFS.club.nestedFields.map(([key, label]) => renderInputField(label, socials[key], `club.socials.${key}`));
                    return `
                        <div class="file-header">
                            <h2>Club overview</h2>
                            <span class="meta-chip">${state.files.club?.exists ? "Tracked file" : "New file"}</span>
                        </div>
                        <div class="record-grid">${mainFields.join("")}</div>
                        <div class="record-card" style="margin-top: 16px;">
                            <h3>Social links</h3>
                            <div class="record-grid">${socialFields.join("")}</div>
                        </div>
                    `;
                }

                function renderArrayEditor(key, arrayKey, itemFactoryFn) {
                    const payload = getFilePayload(key);
                    const entries = Array.isArray(payload?.[arrayKey]) ? payload[arrayKey] : [];
                    if (!entries.length) {
                        return `
                            <div class="file-header">
                                <h2>${FILE_DEFS[key].label}</h2>
                                <button type="button" data-action="add-${key}" class="secondary">Add item</button>
                            </div>
                            <div class="empty-state">No entries in this data file yet.</div>
                        `;
                    }

                    const cards = entries.map((entry, index) => itemFactoryFn(entry, index)).join("");
                    return `
                        <div class="file-header">
                            <h2>${FILE_DEFS[key].label}</h2>
                            <button type="button" data-action="add-${key}" class="secondary">Add item</button>
                        </div>
                        <div class="mini-list">${cards}</div>
                    `;
                }

                function renderGamesEditor() {
                    return renderArrayEditor("games", "games", (entry, index) => {
                        const fields = FILE_DEFS.games.fields.map(([fieldKey, label]) => renderInputField(label, entry[fieldKey], `games.${index}.${fieldKey}`));
                        return `
                            <div class="record-card">
                                <div class="file-header" style="margin-bottom: 0;">
                                    <h3>Game ${index + 1}</h3>
                                    <button type="button" class="danger" data-action="remove-game" data-index="${index}">Remove</button>
                                </div>
                                <div class="record-grid">${fields.join("")}</div>
                            </div>
                        `;
                    });
                }

                function renderTeamsEditor() {
                    const payload = getFilePayload("teams");
                    const entries = Array.isArray(payload?.teams) ? payload.teams : [];
                    if (!entries.length) {
                        return `
                            <div class="file-header">
                                <h2>Teams</h2>
                                <button type="button" data-action="add-teams" class="secondary">Add team</button>
                            </div>
                            <div class="empty-state">No team records exist yet.</div>
                        `;
                    }

                    const cards = entries.map((entry, teamIndex) => {
                        const teamFields = FILE_DEFS.teams.fields.map(([fieldKey, label]) => renderInputField(label, entry[fieldKey], `teams.${teamIndex}.${fieldKey}`));
                        const players = Array.isArray(entry.players) ? entry.players : [];
                        const playerCards = players.map((player, playerIndex) => {
                            const playerFields = [
                                ["position", "Position"],
                                ["name", "Name"],
                                ["number", "Number"],
                                ["imageUrl", "Image URL"],
                                ["yellow", "Yellow"],
                                ["red", "Red"],
                                ["injury", "Injury"],
                                ["goals", "Goals"],
                                ["assists", "Assists"],
                                ["appearances", "Appearances"]
                            ].map(([fieldKey, label]) => renderInputField(label, player[fieldKey], `teams.${teamIndex}.players.${playerIndex}.${fieldKey}`));
                            const notes = renderTextareaField("Notes", player.notes, `teams.${teamIndex}.players.${playerIndex}.notes`);
                            return `
                                <div class="sub-card">
                                    <h4>Player ${playerIndex + 1}</h4>
                                    <div class="record-grid">${playerFields.join("")}</div>
                                    ${notes}
                                </div>
                            `;
                        }).join("");

                        return `
                            <div class="record-card">
                                <div class="file-header" style="margin-bottom: 0;">
                                    <h3>Team ${teamIndex + 1}</h3>
                                    <button type="button" class="danger" data-action="remove-team" data-index="${teamIndex}">Remove</button>
                                </div>
                                <div class="record-grid">${teamFields.join("")}</div>
                                <div class="sub-card" style="margin-top: 12px;">
                                    <h4>Players</h4>
                                    <div class="btn-row"><button type="button" class="secondary" data-action="add-player" data-team-index="${teamIndex}">Add player</button></div>
                                    ${players.length ? playerCards : "<div class='empty-state'>No players assigned to this team yet.</div>"}
                                </div>
                            </div>
                        `;
                    }).join("");

                    return `
                        <div class="file-header">
                            <h2>Teams</h2>
                            <button type="button" data-action="add-teams" class="secondary">Add team</button>
                        </div>
                        <div class="mini-list">${cards}</div>
                    `;
                }

                function renderTablesEditor() {
                    const payload = getFilePayload("tables");
                    const entries = Array.isArray(payload?.tables) ? payload.tables : [];
                    if (!entries.length) {
                        return `
                            <div class="file-header">
                                <h2>Tables</h2>
                                <button type="button" data-action="add-tables" class="secondary">Add table</button>
                            </div>
                            <div class="empty-state">No competition tables exist yet.</div>
                        `;
                    }

                    const cards = entries.map((entry, tableIndex) => {
                        const tableFields = FILE_DEFS.tables.fields.map(([fieldKey, label]) => renderInputField(label, entry[fieldKey], `tables.${tableIndex}.${fieldKey}`));
                        const rows = Array.isArray(entry.rows) ? entry.rows : [];
                        const rowCards = rows.map((row, rowIndex) => {
                            const rowFields = [
                                ["position", "Position"],
                                ["team", "Team"],
                                ["played", "Played"],
                                ["won", "Won"],
                                ["drawn", "Drawn"],
                                ["lost", "Lost"],
                                ["goal_difference", "Goal difference"],
                                ["points", "Points"]
                            ].map(([fieldKey, label]) => renderInputField(label, row[fieldKey], `tables.${tableIndex}.rows.${rowIndex}.${fieldKey}`));
                            return `
                                <div class="sub-card">
                                    <h4>Row ${rowIndex + 1}</h4>
                                    <div class="record-grid">${rowFields.join("")}</div>
                                </div>
                            `;
                        }).join("");

                        return `
                            <div class="record-card">
                                <div class="file-header" style="margin-bottom: 0;">
                                    <h3>Table ${tableIndex + 1}</h3>
                                    <button type="button" class="danger" data-action="remove-table" data-index="${tableIndex}">Remove</button>
                                </div>
                                <div class="record-grid">${tableFields.join("")}</div>
                                <div class="sub-card" style="margin-top: 12px;">
                                    <h4>Table rows</h4>
                                    <div class="btn-row"><button type="button" class="secondary" data-action="add-table-row" data-table-index="${tableIndex}">Add row</button></div>
                                    ${rows.length ? rowCards : "<div class='empty-state'>No rows in this table.</div>"}
                                </div>
                            </div>
                        `;
                    }).join("");

                    return `
                        <div class="file-header">
                            <h2>Tables</h2>
                            <button type="button" data-action="add-tables" class="secondary">Add table</button>
                        </div>
                        <div class="mini-list">${cards}</div>
                    `;
                }

                function renderTicketsEditor() {
                    return renderArrayEditor("tickets", "tickets", (entry, index) => {
                        const fields = FILE_DEFS.tickets.fields.map(([fieldKey, label]) => renderInputField(label, entry[fieldKey], `tickets.${index}.${fieldKey}`));
                        return `
                            <div class="record-card">
                                <div class="file-header" style="margin-bottom: 0;">
                                    <h3>Ticket ${index + 1}</h3>
                                    <button type="button" class="danger" data-action="remove-ticket" data-index="${index}">Remove</button>
                                </div>
                                <div class="record-grid">${fields.join("")}</div>
                            </div>
                        `;
                    });
                }

                function renderEditor() {
                    const key = state.activeKey;
                    const file = state.files[key];
                    if (!file) {
                        editorContainer.innerHTML = '<div class="empty-state">No file is ready to edit.</div>';
                        return;
                    }

                    const tabHtml = Object.entries(FILE_DEFS).map(([entryKey, def]) => {
                        const isActive = entryKey === key;
                        const isDirty = isDirty(entryKey);
                        return `<button type="button" data-key="${entryKey}" class="tab-button ${isActive ? "active" : ""}">${def.label}${isDirty ? " *" : ""}</button>`;
                    }).join("");

                    let bodyMarkup = "";
                    if (key === "club") bodyMarkup = renderClubEditor(file.data || {});
                    else if (key === "games") bodyMarkup = renderGamesEditor();
                    else if (key === "teams") bodyMarkup = renderTeamsEditor();
                    else if (key === "tables") bodyMarkup = renderTablesEditor();
                    else if (key === "tickets") bodyMarkup = renderTicketsEditor();

                    editorContainer.innerHTML = `
                        <div class="tab-list">${tabHtml}</div>
                        ${bodyMarkup}
                    `;

                    editorContainer.querySelectorAll(".tab-button").forEach((button) => {
                        button.addEventListener("click", () => {
                            state.activeKey = button.dataset.key;
                            renderEditor();
                        });
                    });

                    editorContainer.querySelectorAll("input, textarea").forEach((control) => {
                        control.addEventListener("input", (event) => {
                            const path = event.target.dataset.path;
                            if (!path) return;
                            const payload = getFilePayload(key);
                            if (!payload) return;
                            const nextValue = event.target.value;
                            setValueAtPath(payload, path, nextValue);
                            if (payload.metadata) payload.metadata.lastUpdated = new Date().toISOString();
                            markDirty(key, true);
                            renderEditor();
                        });
                    });

                    editorContainer.querySelectorAll("[data-action]").forEach((button) => {
                        button.addEventListener("click", () => handleAction(button.dataset.action, button.dataset.index, button.dataset.teamIndex, button.dataset.tableIndex));
                    });
                }

                function ensureContainerArray(key, arrayKey) {
                    const payload = getFilePayload(key);
                    if (!payload) return;
                    if (!Array.isArray(payload[arrayKey])) {
                        payload[arrayKey] = [];
                    }
                }

                function addItemForKey(key) {
                    const payload = getFilePayload(key);
                    if (!payload) return;

                    if (key === "games") {
                        ensureContainerArray("games", "games");
                        payload.games.push({
                            home_or_away: "Home",
                            home_team: "The Club",
                            away_team: "Opponent",
                            date: "12-08-2026",
                            time: "19:45",
                            competition: "League",
                            venue: "Home Ground",
                            home_score: "",
                            away_score: "",
                            winner: ""
                        });
                    }

                    if (key === "teams") {
                        ensureContainerArray("teams", "teams");
                        payload.teams.push({
                            team_name: "New Team",
                            team_type: "First Team",
                            competition: "League",
                            country: "Country",
                            home_venue: "Stadium",
                            players: []
                        });
                    }

                    if (key === "tables") {
                        ensureContainerArray("tables", "tables");
                        payload.tables.push({
                            title: "League Table",
                            season: "2026/27",
                            rows: []
                        });
                    }

                    if (key === "tickets") {
                        ensureContainerArray("tickets", "tickets");
                        payload.tickets.push({
                            title: "New Ticket Offer",
                            match: "The Club vs Opponent",
                            date: "2026-09-01",
                            venue: "Home Ground",
                            status: "On sale",
                            notes: "",
                            link: "https://example.com"
                        });
                    }

                    if (payload.metadata) payload.metadata.lastUpdated = new Date().toISOString();
                    markDirty(key, true);
                    renderEditor();
                }

                function handleAction(action, indexRaw, teamIndexRaw, tableIndexRaw) {
                    const key = state.activeKey;
                    const payload = getFilePayload(key);
                    const index = Number(indexRaw ?? 0);
                    const teamIndex = Number(teamIndexRaw ?? 0);
                    const tableIndex = Number(tableIndexRaw ?? 0);

                    if (action === `add-${key}`) {
                        addItemForKey(key);
                        return;
                    }

                    if (action === "remove-game" && payload?.games) {
                        payload.games.splice(index, 1);
                        markDirty("games", true);
                        renderEditor();
                        return;
                    }

                    if (action === "remove-team" && payload?.teams) {
                        payload.teams.splice(index, 1);
                        markDirty("teams", true);
                        renderEditor();
                        return;
                    }

                    if (action === "remove-table" && payload?.tables) {
                        payload.tables.splice(index, 1);
                        markDirty("tables", true);
                        renderEditor();
                        return;
                    }

                    if (action === "remove-ticket" && payload?.tickets) {
                        payload.tickets.splice(index, 1);
                        markDirty("tickets", true);
                        renderEditor();
                        return;
                    }

                    if (action === "add-player" && payload?.teams?.[teamIndex]) {
                        if (!Array.isArray(payload.teams[teamIndex].players)) payload.teams[teamIndex].players = [];
                        payload.teams[teamIndex].players.push({
                            position: "ST",
                            name: "New Player",
                            number: "0",
                            imageUrl: "profile_placeholder.png",
                            yellow: 0,
                            red: 0,
                            injury: 0,
                            goals: 0,
                            assists: 0,
                            appearances: 0,
                            notes: ""
                        });
                        markDirty("teams", true);
                        renderEditor();
                        return;
                    }

                    if (action === "add-table-row" && payload?.tables?.[tableIndex]) {
                        if (!Array.isArray(payload.tables[tableIndex].rows)) payload.tables[tableIndex].rows = [];
                        payload.tables[tableIndex].rows.push({
                            position: String(payload.tables[tableIndex].rows.length + 1),
                            team: "Team",
                            played: "0",
                            won: "0",
                            drawn: "0",
                            lost: "0",
                            goal_difference: "0",
                            points: "0"
                        });
                        markDirty("tables", true);
                        renderEditor();
                    }
                }

                async function updateRemoteFiles() {
                    const dirtyKeys = Array.from(state.dirtyKeys);
                    if (!dirtyKeys.length) {
                        setStatus("No changes are waiting to be committed.", "info");
                        return;
                    }

                    const repoFullName = getRepoFullName();
                    if (!repoFullName || !state.token) {
                        setStatus("Authenticate and load a repository before committing changes.", "bad");
                        return;
                    }

                    const message = (commitMessageInput.value || state.commitMessage || "Update fc-template data").trim();
                    if (!message) {
                        setStatus("Add a commit message before submitting the batch.", "bad");
                        return;
                    }

                    setStatus(`Committing ${dirtyKeys.length} file(s) to ${repoFullName}...`, "info");

                    for (const key of dirtyKeys) {
                        const file = state.files[key];
                        if (!file || !file.path) continue;
                        const body = JSON.stringify(file.data, null, 2);
                        const current = await ghFetch(`/repos/${encodeURIComponent(repoFullName)}/contents/${encodeURIComponent(file.path)}`);
                        const content = encodeBase64Utf8(body);
                        await ghFetch(`/repos/${encodeURIComponent(repoFullName)}/contents/${encodeURIComponent(file.path)}`, {
                            method: "PUT",
                            headers: { "Content-Type": "application/json" },
                            body: JSON.stringify({
                                message,
                                content,
                                sha: current?.sha || undefined
                            })
                        });
                        file.sha = current?.sha || file.sha;
                        file.exists = true;
                    }

                    state.dirtyKeys.clear();
                    renderEditor();
                    setStatus(`Committed ${dirtyKeys.length} file(s) successfully.`, "ok");
                }

                function resetEdits() {
                    state.dirtyKeys.clear();
                    renderEditor();
                    setStatus("Local edits were reset to the currently loaded file contents.", "info");
                }

                document.getElementById("signInBtn").addEventListener("click", async () => {
                    try {
                        if (!state.token) {
                            await startDeviceFlow();
                        } else {
                            await loadRepository();
                        }
                    } catch (error) {
                        setStatus(error.message || "GitHub authentication failed.", "bad");
                    }
                });

                document.getElementById("loadRepoBtn").addEventListener("click", async () => {
                    try {
                        await loadRepository();
                    } catch (error) {
                        setStatus(error.message || "The repository could not be loaded.", "bad");
                    }
                });

                document.getElementById("commitBtn").addEventListener("click", async () => {
                    await updateRemoteFiles();
                });

                document.getElementById("resetBtn").addEventListener("click", () => {
                    resetEdits();
                });

                const storedSession = getStoredSession();
                if (storedSession?.accessToken) {
                    state.token = storedSession.accessToken;
                    setStatus("Stored GitHub session found. You can load the repository immediately.", "ok");
                }

                const currentConfig = window.FC_MANAGER_CONFIG || {};
                if (currentConfig.repoFullName) repoInput.value = currentConfig.repoFullName;
                if (currentConfig.siteBaseUrl) siteUrlInput.value = currentConfig.siteBaseUrl;
                if (currentConfig.commitMessage) commitMessageInput.value = currentConfig.commitMessage;

                window.FC_MANAGER_CONFIG = {
                    ...DEFAULT_CONFIG,
                    repoFullName: repoInput.value.trim() || DEFAULT_CONFIG.repoFullName,
                    siteBaseUrl: siteUrlInput.value.trim() || DEFAULT_CONFIG.siteBaseUrl,
                    commitMessage: commitMessageInput.value.trim() || DEFAULT_CONFIG.commitMessage,
                    oauth: DEFAULT_CONFIG.oauth
                };
            })();
        </script>
    </body>
</html>
