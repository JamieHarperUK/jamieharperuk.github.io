<html lang="en">
    <head>
        <meta charset="UTF-8">
        <title>Redirecting...</title>
        <script>
            const targetUrl = "https://jamieharperuk.github.io/fm/";
            window.location.replace(targetUrl);

            document.write("<p>Redirecting to <a href='" + targetUrl + "'>" + targetUrl + "</a>...</p>");

        </script>
    </body>
</html>
