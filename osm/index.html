<!DOCTYPE html>
<html lang="en">
    <head>
        <meta property="og:title" content="My OSM Portfolio">
        <meta property="og:description" content="Follow my progress as I manage multiple teams across different leagues in Online Soccer Manager.">
        <meta property="og:image" content="https://jamieharperuk.github.io/osm/data/uk_osm_bg.png">

        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">

        <link rel="icon" type="image/png" sizes="32x32" href="https://en.onlinesoccermanager.com/favicon-32x32.png?v=3.252.0">
        <title>My OSM Portfolio</title>

        <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
        <link rel="stylesheet" href="data/styles.css">
    </head>
    <body>
        <header>
            <nav>
                <div class="nav-brand" onclick="app.navigate('#home')"><i class="fas fa-futbol"></i> My OSM Portfolio</div>
                <div class="nav-links" id="navLinks"></div>
            </nav>
        </header>

        <main id="app">
            <div id="home" class="page active">
                <h1 class="section-title">Welcome</h1>
                <div class="notes-section">
                    <div class="notes-content" id="notesContent">
                        Welcome to my Online Soccer Manager portfolio! Follow my progress as I manage multiple teams across different leagues. Check out each team's page to see squad details, and come back here to see upcoming fixtures.
                    </div>
                </div>

                <h2 class="section-title">Manager Overview</h2>
                <div class="manager-stats" id="managerStatsContainer"></div>

                <h2 class="section-title" style="margin-top: 3rem;">Upcoming Fixtures</h2>
                <div class="fixtures-grid" id="nextFixturesContainer"></div>
            </div>

            <div id="teamPagesContainer"></div>
        </main>

        <script src="./data/dataset.js"></script>
        <script>
            const app = {
                currentPage: 'home',
                managedTeamIds: ['e2d_manchester_united', 'w2026_England'],

                init() {
                    this.setupNavigation();
                    this.generateTeamPages();
                    this.renderHome();
                    this.setupHashRouting();
                },

                setupNavigation() {
                    const navLinks = document.getElementById('navLinks');
                    const homeLink = document.createElement('a');
                    homeLink.textContent = 'Home';
                    homeLink.href = '#home';
                    homeLink.className = 'active';
                    navLinks.appendChild(homeLink);

                    this.managedTeamIds.forEach(teamId => {
                        const team = teams[teamId];
                        const link = document.createElement('a');
                        link.textContent = team.name;
                        link.href = `#team/${teamId}`;
                        navLinks.appendChild(link);
                    });

                    this.updateNavLinks();
                },

                setupHashRouting() {
                    window.addEventListener('hashchange', () => this.handleRoute());
                    this.handleRoute();
                },

                handleRoute() {
                    const hash = window.location.hash.slice(1) || 'home';
                    
                    if (hash === 'home') {
                        this.navigate('home');
                    } else if (hash.startsWith('team/')) {
                        const teamId = hash.split('/')[1];
                        this.navigate(`team/${teamId}`);
                    }
                },

                navigate(path) {
                    this.currentPage = path;
                    document.querySelectorAll('.page').forEach(p => p.classList.remove('active'));
                    
                    this.updateNavLinks();

                    if (path === 'home') {
                        document.getElementById('home').classList.add('active');
                        this.renderHome();
                    } else if (path.startsWith('team/')) {
                        const teamId = path.split('/')[1];
                        const pageId = `team-${teamId}`;
                        const page = document.getElementById(pageId);
                        if (page) {
                            page.classList.add('active');
                            this.renderTeamPage(teamId);
                        }
                    }

                    window.scrollTo(0, 0);
                },

                updateNavLinks() {
                    document.querySelectorAll('.nav-links a').forEach(link => {
                        link.classList.remove('active');
                        if (this.currentPage === 'home' && link.getAttribute('href') === '#home') {
                            link.classList.add('active');
                        } else if (this.currentPage.startsWith('team/')) {
                            const teamId = this.currentPage.split('/')[1];
                            if (link.getAttribute('href') === `#team/${teamId}`) {
                                link.classList.add('active');
                            }
                        }
                    });
                },

                generateTeamPages() {
                    const container = document.getElementById('teamPagesContainer');
                    this.managedTeamIds.forEach(teamId => {
                        const page = document.createElement('div');
                        page.id = `team-${teamId}`;
                        page.className = 'page';
                        page.innerHTML = `<div id="content-${teamId}"></div>`;
                        container.appendChild(page);
                    });
                },

                renderHome() {
                    this.renderManagerStats();
                    this.renderNextFixtures();
                },

                renderManagerStats() {
                    const container = document.getElementById('managerStatsContainer');
                    container.innerHTML = `
                        <div class="stat-card">
                            <div class="stat-label">Manager Name</div>
                            <div class="stat-value">${manager.name}</div>
                        </div>
                        <div class="stat-card">
                            <div class="stat-label">Rank</div>
                            <div class="stat-value">${manager.rank[0]}</div>
                            <div class="stat-subtext">${manager.rank[1]}</div>
                        </div>
                        <div class="stat-card">
                            <div class="stat-label">Medals</div>
                            <div class="stat-value">${manager.medals}</div>
                        </div>
                        <div class="stat-card">
                            <div class="stat-label">World Rank</div>
                            <div class="stat-value">#${manager.world_rank.toLocaleString()}</div>
                        </div>
                    `;
                },

                renderNextFixtures() {
                    const container = document.getElementById('nextFixturesContainer');
                    container.innerHTML = '';

                    const nextFixtures = upcoming_fixtures.filter(fixture => {
                        return this.managedTeamIds.some(teamId => {
                            const team = teams[teamId];
                            return fixture.my_team.name === team.name;
                        }) && (fixture.result[fixture.my_team.name] === null || fixture.result[fixture.opponent_team.name] === null);
                    });

                    if (nextFixtures.length === 0) {
                        container.innerHTML = '<p>No upcoming fixtures at the moment.</p>';
                        return;
                    }

                    nextFixtures.forEach(fixture => {
                        container.appendChild(this.createFixtureCard(fixture, 'home'));
                    });
                },

                createFixtureCard(fixture, view = 'home') {
                    const card = document.createElement('div');
                    card.className = 'fixture-card';

                    const isPastResult = fixture.result[fixture.my_team.name] !== null && 
                                        fixture.result[fixture.opponent_team.name] !== null;
                    const myTeamScore = fixture.result[fixture.my_team.name];
                    const opponentScore = fixture.result[fixture.opponent_team.name];

                    const headerClass = isPastResult ? 'past' : 'upcoming';
                    const statusText = isPastResult ? 'PAST RESULT' : 'UPCOMING';

                    let scoreDisplay = '';
                    if (isPastResult) {
                        scoreDisplay = `${myTeamScore} - ${opponentScore}`;
                    } else {
                        scoreDisplay = 'vs';
                    }

                    card.innerHTML = `
                        <div class="fixture-header">
                            <div class="fixture-status ${headerClass}">${statusText}</div>
                            <div class="fixture-league">${fixture.metadata.league} - ${fixture.metadata.stage}</div>
                        </div>
                        <div class="fixture-body">
                            <div class="fixture-date">${fixture.date_time[0]} at ${fixture.date_time[1]}</div>
                            
                            <div class="fixture-match">
                                <div class="team">
                                    <div class="team-name">${fixture.my_team.name}</div>
                                </div>
                                <div class="fixture-score ${isPastResult ? '' : 'pending'}">${scoreDisplay}</div>
                                <div class="team">
                                    <div class="team-name">${fixture.opponent_team.name}</div>
                                </div>
                            </div>

                            <div class="fixture-venue">${fixture.venue}</div>

                            ${!isPastResult ? `
                                <div class="fixture-lineups">
                                    <div class="lineup-section">
                                        <div class="lineup-title">${fixture.my_team.name} Lineup</div>
                                        ${fixture.my_team.lineup === null 
                                            ? '<div class="lineup-status">Not yet confirmed</div>' 
                                            : this.formatLineup(fixture.my_team.lineup)
                                        }
                                    </div>
                                    <div class="lineup-section">
                                        <div class="lineup-title">${fixture.opponent_team.name} Lineup</div>
                                        ${fixture.opponent_team.lineup === null 
                                            ? '<div class="lineup-status">Not yet confirmed</div>' 
                                            : this.formatLineup(fixture.opponent_team.lineup)
                                        }
                                    </div>
                                </div>
                            ` : ''}
                        </div>
                    `;

                    return card;
                },

                formatLineup(lineup) {
                    if (!lineup || !lineup.formation) return '<div class="lineup-status">Not yet confirmed</div>';
                    
                    const formationText = lineup.formation;
                    const players = lineup.on_field.flat().filter(p => p);
                    const subs = lineup.substitutes || [];

                    return `
                        <div class="lineup-content">
                            <strong>Formation:</strong> ${formationText}<br>
                            <strong>Starting 11:</strong> ${players.join(', ')}<br>
                            <strong>Substitutes:</strong> ${subs.join(', ')}
                        </div>
                    `;
                },

                renderTeamPage(teamId) {
                    const team = teams[teamId];
                    const content = document.getElementById(`content-${teamId}`);

                    content.innerHTML = `
                        <div class="team-header">
                            <div class="team-name-large">${team.name}</div>
                            <div class="team-league">${team.league}</div>
                            <div class="team-stage">${team.stage}</div>
                        </div>

                        <div class="team-stats" id="teamStats-${teamId}"></div>

                        <h2 class="section-title">Fixtures</h2>
                        <div class="fixtures-tabs" id="fixtureTabs-${teamId}">
                            <button class="tab-button active" data-tab="upcoming">Upcoming Fixtures</button>
                            <button class="tab-button" data-tab="past">Past Results</button>
                        </div>
                        <div class="tab-content active" id="upcoming-${teamId}">
                            <div class="fixtures-grid" id="teamFixtures-${teamId}"></div>
                        </div>
                        <div class="tab-content" id="past-${teamId}">
                            <div class="fixtures-grid" id="teamPastResults-${teamId}"></div>
                        </div>

                        <h2 class="section-title">Squad</h2>
                        <div class="squad-container" id="squad-${teamId}"></div>
                    `;

                    this.renderTeamStats(team, teamId);
                    this.renderTeamFixtures(team, teamId);
                    this.renderTeamPastResults(team, teamId);
                    this.renderSquad(team, teamId);
                    this.setupFixtureTabs(teamId);
                },

                renderTeamStats(team, teamId) {
                    const container = document.getElementById(`teamStats-${teamId}`);
                    container.innerHTML = `
                        <div class="team-stat-card">
                            <div class="team-stat-label">Position</div>
                            <div class="team-stat-value">#${team.position}</div>
                        </div>
                        <div class="team-stat-card">
                            <div class="team-stat-label">Points</div>
                            <div class="team-stat-value">${team.points}</div>
                        </div>
                        <div class="team-stat-card">
                            <div class="team-stat-label">Played</div>
                            <div class="team-stat-value">${team.matches_played}</div>
                        </div>
                        <div class="team-stat-card">
                            <div class="team-stat-label">Wins</div>
                            <div class="team-stat-value">${team.wins}</div>
                        </div>
                        <div class="team-stat-card">
                            <div class="team-stat-label">Draws</div>
                            <div class="team-stat-value">${team.draws}</div>
                        </div>
                        <div class="team-stat-card">
                            <div class="team-stat-label">Losses</div>
                            <div class="team-stat-value">${team.losses}</div>
                        </div>
                        <div class="team-stat-card">
                            <div class="team-stat-label">Squad Value</div>
                            <div class="team-stat-value">$${team.squad_value}M</div>
                        </div>
                        <div class="team-stat-card">
                            <div class="team-stat-label">Squad Size</div>
                            <div class="team-stat-value">${team.squad_count}</div>
                        </div>
                    `;
                },

                renderTeamFixtures(team, teamId) {
                    const container = document.getElementById(`teamFixtures-${teamId}`);
                    container.innerHTML = '';

                    const teamFixtures = upcoming_fixtures.filter(fixture => 
                        fixture.my_team.name === team.name && 
                        (fixture.result[fixture.my_team.name] === null || fixture.result[fixture.opponent_team.name] === null)
                    );

                    if (teamFixtures.length === 0) {
                        container.innerHTML = '<p>No upcoming fixtures for this team.</p>';
                        return;
                    }

                    teamFixtures.forEach(fixture => {
                        container.appendChild(this.createFixtureCard(fixture, 'team'));
                    });
                },

                renderTeamPastResults(team, teamId) {
                    const container = document.getElementById(`teamPastResults-${teamId}`);
                    container.innerHTML = '';

                    const teamPastResults = upcoming_fixtures.filter(fixture => 
                        fixture.my_team.name === team.name && 
                        fixture.result[fixture.my_team.name] !== null && 
                        fixture.result[fixture.opponent_team.name] !== null
                    );

                    if (teamPastResults.length === 0) {
                        container.innerHTML = '<p>No past results for this team yet.</p>';
                        return;
                    }

                    teamPastResults.forEach(fixture => {
                        container.appendChild(this.createFixtureCard(fixture, 'team'));
                    });
                },

                setupFixtureTabs(teamId) {
                    const tabButtons = document.querySelectorAll(`#fixtureTabs-${teamId} .tab-button`);
                    const tabContents = document.querySelectorAll(`#upcoming-${teamId}, #past-${teamId}`);

                    tabButtons.forEach(button => {
                        button.addEventListener('click', (e) => {
                            const tabName = e.target.dataset.tab;
                            
                            tabButtons.forEach(btn => btn.classList.remove('active'));
                            tabContents.forEach(content => content.classList.remove('active'));
                            
                            e.target.classList.add('active');
                            document.getElementById(`${tabName}-${teamId}`).classList.add('active');
                        });
                    });
                },

                renderSquad(team, teamId) {
                    const container = document.getElementById(`squad-${teamId}`);
                    container.innerHTML = '';

                    const formatValue = (value) => {
                        if (value < 1) {
                            return `$${(value * 1000).toFixed(0)}K`;
                        } else {
                            return `$${value}M`;
                        }
                    };

                    const getPositionGroup = (position) => {
                        if (['ST', 'LW', 'RW'].includes(position)) return 'Forwards';
                        if (['CAM', 'CM', 'CDM'].includes(position)) return 'Midfielders';
                        if (['CB', 'LB', 'RB'].includes(position)) return 'Defenders';
                        if (position === 'GK') return 'Goalkeepers';
                        return 'Other';
                    };

                    const groupedPlayers = {
                        'Forwards': [],
                        'Midfielders': [],
                        'Defenders': [],
                        'Goalkeepers': []
                    };

                    team.squad.forEach(player => {
                        const [shirt, name, age, position, nationality, value, cards] = player;
                        const group = getPositionGroup(position);
                        if (groupedPlayers[group]) {
                            groupedPlayers[group].push(player);
                        }
                    });

                    const positionIcons = {
                        'Forwards': 'fa-person-running',
                        'Midfielders': 'fa-people',
                        'Defenders': 'fa-shield',
                        'Goalkeepers': 'fa-hand'
                    };

                    Object.entries(groupedPlayers).forEach(([groupName, players]) => {
                        if (players.length === 0) return;

                        const groupDiv = document.createElement('div');
                        groupDiv.className = 'squad-position-group';

                        const titleDiv = document.createElement('div');
                        titleDiv.className = 'squad-position-title';
                        titleDiv.innerHTML = `<i class="fas ${positionIcons[groupName]}"></i> ${groupName}`;
                        groupDiv.appendChild(titleDiv);

                        const gridDiv = document.createElement('div');
                        gridDiv.className = 'squad-grid';

                        players.forEach(player => {
                            const [shirt, name, age, position, nationality, value, cards] = player;
                            const yellowCards = cards[0];
                            const redCards = cards[1];

                            const playerCard = document.createElement('div');
                            playerCard.className = 'player-card';
                            playerCard.innerHTML = `
                                <div class="player-shirt">${shirt}</div>
                                <div class="player-name">${name}</div>
                                <div class="player-info">
                                    <div>${position}</div>
                                    <div>${age} yrs</div>
                                    <div>${nationality}</div>
                                    <div>${formatValue(value)}</div>
                                </div>
                                ${(yellowCards > 0 || redCards > 0) ? `
                                    <div class="player-cards">
                                        ${Array(yellowCards).fill().map(() => '<span class="card yellow">Y</span>').join('')}
                                        ${Array(redCards).fill().map(() => '<span class="card red">R</span>').join('')}
                                    </div>
                                ` : ''}
                            `;
                            gridDiv.appendChild(playerCard);
                        });

                        groupDiv.appendChild(gridDiv);
                        container.appendChild(groupDiv);
                    });
                }
            };

            document.addEventListener('DOMContentLoaded', () => app.init());
        </script>
    </body>
</html>
